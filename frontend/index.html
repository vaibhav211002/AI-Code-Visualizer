<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>

    <header>
        <h1>⚡ Code Visualizer</h1>
        <p>Paste Python code to generate diagrams and AI explanations</p>
    </header>

    <main>
        <!-- Input Section -->
        <section class="input-section">
            <textarea id="code-input"></textarea>
            <button id="analyze-btn">Analyze Code</button>
        </section>

        <!-- Error Message -->
        <div id="error-box" class="error-box hidden"></div>

        <!-- Loading -->
        <div id="loader" class="hidden">Analyzing your code...</div>

        <!-- Results -->
        <section id="results" class="hidden">

            <!-- AI Explanation -->
            <div class="card">
                <h2>📝 Explanation</h2>
                <p id="explanation"></p>
            </div>

            <!-- Complexity -->
            <div class="card">
                <h2>⏱ Complexity</h2>
                <p id="complexity"></p>
            </div>

            <!-- Flowchart -->
            <div class="card">
                <h2>🔀 Flowchart</h2>
                <div id="flowchart" class="diagram"></div>
            </div>

            <!-- UML -->
            <div class="card">
                <h2>🧩 UML Class Diagram</h2>
                <div id="uml" class="diagram"></div>
            </div>

            <!-- Call Graph -->
            <div class="card">
                <h2>📞 Call Graph</h2>
                <div id="call-graph" class="diagram"></div>
            </div>

        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="app.js"></script>

</body>

</body>
</html>
